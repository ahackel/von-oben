<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Von Oben</title>
<link rel="icon" href="data:,">
<meta name="description" content="Ein Weißkopfseeadler über einer Insel: laufen, fliegen, schwimmen, tauchen.">
<meta name="theme-color" content="#7aa5cf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Von Oben">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; image-rendering: pixelated; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<pre id="errors" style="position:fixed;left:8px;right:8px;bottom:8px;margin:0;color:#fff;background:rgba(160,20,40,.85);font:13px/1.3 monospace;white-space:pre-wrap;display:none;z-index:9"></pre>
<script>
  // errors on the screen (there is no console on an iPad): from loading the game too
  const shown = (m) => { const e = document.getElementById('errors'); e.style.display = 'block'; e.textContent += m + '\n'; };
  addEventListener('error', (e) => shown(`${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno}:${e.colno})`));
  addEventListener('unhandledrejection', (e) => shown(`${e.reason && (e.reason.stack || e.reason)}`));
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
